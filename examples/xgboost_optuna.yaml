seed: 42
output_dir: ../outputs/xgboost_optuna
data:
  type: csv
  path: ../data/demo/samples.csv
  prediction_path: ../data/demo/prediction.csv
  features: [distance, thermal_proxy, deformation, surface_temperature, depth_proxy, noise]
  x_column: x
  y_column: y
model:
  name: xgboost
  params: {n_estimators: 50, tree_method: hist, eval_metric: logloss}
  n_jobs: 1
preprocess:
  feature_scales: {deformation: 1.0e12}
sampling: {ratio: 3, coverage: 0.90}
cv: {strategy: stratified, folds: 3}
optimizer:
  name: optuna
  screening_rounds: 2
  space:
    model.max_depth: {type: int, low: 2, high: 6}
    model.learning_rate: {type: float, low: 0.02, high: 0.2, log: true}
    model.subsample: {type: float, low: 0.6, high: 1.0}
    sampling.ratio: {type: int, low: 2, high: 4}
  options: {n_trials: 5}
explain: {enabled: true, method: tree, bins: 20, interactions: false}
outputs: {csv: true, excel: true}
plots: {enabled: true, dpi: 600}
