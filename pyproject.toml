[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pu-bagging-framework"
version = "0.1.0"
description = "Configurable positive-unlabeled bagging with interchangeable models and optimizers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "PyYAML>=6", "joblib>=1.3"]

[project.optional-dependencies]
geo = ["rasterio>=1.3", "geopandas>=0.14"]
xgboost = ["xgboost>=2.0"]
optuna = ["optuna>=3.5"]
explain = ["shap>=0.45"]
plots = ["matplotlib>=3.7"]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=8", "build>=1"]
all = ["rasterio>=1.3", "geopandas>=0.14", "xgboost>=2.0", "optuna>=3.5", "shap>=0.45", "matplotlib>=3.7", "openpyxl>=3.1"]

[project.scripts]
pu-bagging = "pu_bagging.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
